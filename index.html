<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Packman — arcade tribute</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1a7 7 0 1 0 0 14 7 7 0 0 0 5.9-3.2L8 8l5.9-3.8A7 7 0 0 0 8 1z' fill='%23ffff00'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: monospace;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  #help {
    color: #555; font-size: 11px; margin-top: 4px;
    text-align: center; user-select: none;
  }
  @media (max-height: 500px) { #help { display: none; } }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="help">ENTER/SPACE: start &nbsp; ARROWS/WASD or swipe: move &nbsp; M: mute</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
